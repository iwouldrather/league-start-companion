'use strict';
const D=JSON.parse(document.getElementById('guideData').textContent),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=0,itemFilter='Equipment',targetLevels=false,zoom=1;
let owned={};try{owned=JSON.parse(localStorage.getItem('slayer-owned-v1')||'{}')}catch{}
const uniqueNames=s=>[...new Set(s.groups.flatMap(g=>g.gems.filter(x=>!x.itemGranted).map(x=>x.nameSpec)))];
const comparison=i=>Math.max(0,i-1);
const newNames=i=>i===0?uniqueNames(D.sets[i]):uniqueNames(D.sets[i]).filter(n=>!uniqueNames(D.sets[comparison(i)]).includes(n));
function route(name){const a=D.acquisition[name];return {act:a[0],vendor:a[1],quest:a[2],kind:a[3],source:a[4]||'https://poedb.tw/us/Quest'};}
function routeText(name,link=true){const r=route(name),v=r.act?`Act ${r.act} · ${r.vendor} · after ${r.quest}`:`${r.vendor} · ${r.quest}`;return link?`<a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(v)}</a>`:esc(v);}
function makeNav(){let html='';for(const [label,start,end] of (D.imported?[['Imported milestones',0,D.sets.length]]:[['Campaign',0,5],['Atlas progression',5,8]])){html+=`<div class="navgroup"><p class="eyebrow">${esc(label)}</p>`;for(let i=start;i<Math.min(end,D.sets.length);i++){const s=D.sets[i];html+=`<button class="tab" id="tab-${i}" type="button" role="tab" aria-controls="stage" aria-selected="${i===current}" tabindex="${i===current?0:-1}" data-tab="${i}"><span class="num">${esc(s.short)}</span><span class="label"><strong>${esc(s.nav)}</strong>${esc(s.navSub)}</span></button>`;}html+='</div>';}html+=`<div class="sidefoot">${infoTip((D.imported?D.name:"Leveling guide")+". "+D.sets.length+" milestones. Bandit: "+(D.build?.bandit||"Not specified"),"About this guide")}</div>`;$('navigation').innerHTML=html;}
function gemRow(g,group,i){const r=route(g.nameSpec),isNew=newNames(i).includes(g.nameSpec),off=group.enabled==='false'||g.enabled==='false';return `<div class="gemrow"><span class="gemicon c${g.color}" aria-label="${['','red','green','blue','white'][g.color]||'neutral'} gem"></span><div><div class="gemtitle"><span>${esc(g.nameSpec)}</span>${isNew&&!g.itemGranted?'<span class="new">new</span>':''}${off?`<span class="state">${group.enabled==='false'?'group disabled':'gem disabled'}</span>`:''}</div><div class="acq">${routeText(g.nameSpec)}</div><div class="gemmeta">PoB gem level ${esc(g.level)} · ${esc(g.quality)}% quality${g.requiredLevel?` · requires character ${g.requiredLevel} at this gem level`:''}</div></div><span class="uselevel">${g.itemGranted?'Item effect':`Use from ${g.minLevel??"?"}`}</span></div>`;}
function skills(s,i){const rank=g=>g.main?0:g.enabled==="false"?4:g.slot==="Body Armour"&&g.gems.some(x=>!x.isSupport&&!x.itemGranted)?1:g.gems.some(x=>!x.isSupport&&!x.itemGranted)?2:3;return s.groups.filter(g=>g.gems.some(x=>!x.itemGranted)).sort((a,b)=>rank(a)-rank(b)).map(g=>{const gems=g.gems.filter(x=>!x.itemGranted);return `<article class="skillgroup ${g.enabled==='false'?'disabledgroup':''}"><header class="grouphead"><div><div class="slot">${esc(g.slot||'Utility')}${rank(g)===0?' · Main skill':''}</div><h3>${esc(g.label.replace(/^(Helm|Body|Boots|Gloves|Weapon)\s*-\s*/,''))}</h3></div><div class="sockets" aria-label="Gem colours">${gems.filter(x=>g.enabled!=='false'&&x.enabled!=='false').map((x,k)=>`${k?'<span class="socketlink"></span>':''}<i class="c${x.color}"></i>`).join('')}</div></header>${gems.map(x=>gemRow(x,g,i)).join('')}</article>`;}).join('');}
function passiveList(list){return list.map(n=>`<div class="passive"><strong>${esc(n.name)}</strong><ul>${n.stats.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');}
function changes(i){if(!i)return '<h3>Start here</h3><p>Assemble the Spectral Throw links as Act 1 quests unlock. Leap Slam requires character level 10.</p>';const prev=D.sets[comparison(i)],s=D.sets[i],added=newNames(i),removed=uniqueNames(prev).filter(n=>!uniqueNames(s).includes(n));return `<h3>${i>=8?'Compared with level 96':'Changes from '+esc(prev.short)}</h3>${added.length?`<p><strong>Add:</strong> ${added.map(esc).join(', ')}.</p>`:'<p>No new socketed gem names in this loadout.</p>'}${removed.length?`<p><strong>Removed from this preset:</strong> ${removed.map(esc).join(', ')}.</p>`:''}`;}
function shopping(s,i){const names=newNames(i);if(!names.length)return '';const sorted=names.slice().sort((a,b)=>{const x=route(a),y=route(b);return (x.act||9)-(y.act||9)||(D.meta[a].minLevel||0)-(D.meta[b].minLevel||0)||a.localeCompare(b);});return `<section class="shop"><div class="sectionhead"><div><p class="eyebrow">Acquisition checklist</p><h2>${i===0?'Get these in Act 1':i>=8?'Gems for this alternative':'New gems for this milestone'}</h2></div></div><p class="explain">${i===0?'All socketed gem names in this milestone.':i>=8?'Compared with the level-96 loadout.':'New gem names compared with the previous milestone.'} Tick gems you already own. Your checks stay in this browser.</p><div class="shopgrid">${sorted.map(n=>`<div class="shopitem"><input type="checkbox" id="owned-${D.names.indexOf(n)}" data-owned="${esc(n)}" ${owned[n]?'checked':''}><label for="owned-${D.names.indexOf(n)}"><strong>${esc(n)}${s.groups.flatMap(g=>g.gems).filter(g=>g.nameSpec===n&&g.enabled!=='false').length>1?' ×'+s.groups.flatMap(g=>g.gems).filter(g=>g.nameSpec===n&&g.enabled!=='false').length:''}</strong>${!s.groups.some(g=>g.enabled!=='false'&&g.gems.some(x=>x.nameSpec===n&&x.enabled!=='false'))?'<small>Optional · disabled in this PoB loadout</small>':''}<small>Use from character ${D.meta[n].minLevel} · ${routeText(n)}</small></label></div>`).join('')}</div></section>`;}
function itemCategory(it){return /Flask/.test(it.slot)?'Flasks':/Tree jewel|Abyssal/.test(it.slot)?'Jewels':'Equipment';}
function itemCards(s){const items=s.items.filter(it=>itemCategory(it)===itemFilter);if(!items.length)return `<div class="emptyitem">No ${itemFilter.toLowerCase()} specified in this PoB preset.</div>`;return items.map((it,k)=>`<article class="itemcard ${it.rarity.toLowerCase()}"><p class="itemslot">${esc(it.slot)}</p><h3 class="itemname">${esc(it.name)}</h3><p class="itembase">${esc(it.base)}${it.requirement?` · Requires level ${it.requirement}`:''}</p><div class="itemsummary">${it.highlights.map(x=>`<p>${esc(x)}</p>`).join('')}</div><details><summary>Full PoB item details</summary><pre>${esc(it.clean)}</pre><button class="copyitem" data-copy="${s.items.indexOf(it)}">Copy PoB item</button></details></article>`).join('');}
function render(i,focus=false){current=i;itemFilter='Equipment';const s=D.sets[i],granted=s.groups.flatMap(g=>g.gems.filter(x=>x.itemGranted));makeNav();$('stage').setAttribute('aria-labelledby',`tab-${i}`);$('stage').classList.toggle('showtargets',targetLevels);$('stage').innerHTML=`
<header class="stagehero"><div><p class="eyebrow">${i<5?'Campaign':i<8?'Atlas progression':'Endgame alternative'} · ${i+1} / ${D.sets.length}</p><h1>${esc(s.heading)}</h1><p class="subtitle">${esc(s.description)}</p><div class="tagrow"><span class="badge important">${esc(s.title)}</span><span class="badge">${s.groups.filter(g=>g.gems.some(x=>!x.itemGranted)).length} socket groups</span><span class="badge">${s.items.length} specified ${s.items.length===1?'item':'items'}</span>${s.ascendancy.length?`<span class="badge">${s.ascendancy.length*2} Slayer points</span>`:''}</div></div><div class="stagecontrols"><button data-step="-1" ${i===0?'disabled':''} aria-label="Previous milestone">←</button><button data-step="1" ${i===D.sets.length-1?'disabled':''} aria-label="Next milestone">→</button></div></header>
${s.cautions.length?`<aside class="callout"><strong>${esc(s.cautionTitle)}</strong>${s.cautions.map(x=>`<p>${esc(x)}</p>`).join('')}</aside>`:''}
<div class="contentgrid"><section aria-labelledby="skillsTitle"><div class="sectionhead"><div><p class="eyebrow">01 · Socket groups</p><h2 id="skillsTitle">Skills & links</h2></div><label class="switchlabel"><input type="checkbox" id="targetToggle" ${targetLevels?'checked':''}>Show PoB gem levels</label></div>${skills(s,i)}${granted.length?`<details class="snapshotdetails"><summary>Item-granted effects (${granted.length})</summary>${granted.map(g=>`<div class="passive"><strong>${esc(g.nameSpec)}</strong><p>${routeText(g.nameSpec)}</p></div>`).join('')}</details>`:''}${s.skillImage?`<details class="snapshotdetails"><summary>Original PoB skills screenshot</summary><img src="${s.skillImage}" alt="Original skills screenshot for ${esc(s.title)}" loading="lazy"></details>`:''}</section>

async function changeProgress(action,name,owned){
 if(!purchaseReady||purchasePending.size)return;
 const character=purchaseCharacter;purchasePending.add('progress');decorateOwnership();
 try{
  let data;
  if(location.protocol==='file:'){
   const saved=offlinePurchases(character);let gems={...saved.owned},history=saved.history;
   if(action==='undo'){if(history.length)gems=history.pop().owned;}
   else{
    const next=action==='reset'?{}:{...gems};if(action==='set'){if(owned)next[name]=true;else delete next[name];}
    if(JSON.stringify(next)!==JSON.stringify(gems)){history.push({owned:gems,label:action==='reset'?'Reset all gem progress':(owned?'Completed ':'Unchecked ')+name});history=history.slice(-30);gems=next;}
   }
   localStorage.setItem('slayer-owned:'+character,JSON.stringify(gems));localStorage.setItem('slayer-owned-history:'+character,JSON.stringify(history));data={owned:gems,canUndo:!!history.length,undoLabel:history.at(-1)?.label};
  }else{

}

function nativeGraphic(uri,label,extra=''){

 const ax=Math.max(box.x,Math.min(box.x+box.width,anchor.x)),ay=Math.max(box.y,Math.min(box.y+box.height,anchor.y));
 return {x:Math.max(origin.x,Math.min(origin.x+origin.width-width,ax-(ax-box.x)*ratio)),y:Math.max(origin.y,Math.min(origin.y+origin.height-height,ay-(ay-box.y)*ratio)),width,height};
}

 const treeRecord=e.target.closest('[data-tree-record]');if(treeRecord){const s=passiveCheckpointSetup();record(s.short+' · '+s.nav+' · '+(treeRecord.dataset.treeRecord==='passives'?'Notables':'Masteries'),passiveList(treeRecord.dataset.treeRecord==='passives'?s.notables:s.masteryDetails)||'<p>No selected effects in this checkpoint.</p>');}
 const node=e.target.closest('[data-node]');if(node){const setup=node.closest('.ascendancycanvas,.asclarge')?D.sets[current]:passiveCheckpointSetup(),detail=setup.nodeDetails?.[node.dataset.node];if(detail)record(detail.name,`<p class="nodestate">${detail.ascendancy?'Ascendancy · ':''}${{new:'New at this step',removed:'Removed since the previous step',kept:'Already allocated',unallocated:'Not allocated in this setup'}[detail.state]}</p>${detail.stats.map(stat=>`<p class="nodestat">${esc(stat)}</p>`).join('')||'<p>Starting node · no passive point required.</p>'}`);}
 if(e.target.closest('[data-asc-details]')){const s=D.sets[current];record('Ascendancy · '+(D.build?.ascendClassName||D.build?.className),`<div class="asclarge">${nativeGraphic(s.ascendancyImage,'Ascendancy nodes')}</div>${passiveList(s.ascendancy)}`);}
});
// Keep the same tree controls available in the scrolling layout on smaller windows.
const preCheckpointRender=render;
render=function(i,focus=false){preCheckpointRender(i,focus);if(D.sets.length&&!document.querySelector('#stage .treecheckpointnav'))refreshPassiveCheckpoint();};
if(D.sets.length&&!document.querySelector('#stage .treecheckpointnav'))refreshPassiveCheckpoint();

document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.matches('[data-node]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
if(D.uiAssets){
 document.body.classList.add('poetheme');
 if(D.uiAssets.texture)document.documentElement.style.setProperty('--poe-texture',`url("${D.uiAssets.texture}")`);
 if(D.uiAssets.portrait){const mark=document.querySelector('.brandmark');mark.classList.add('classportrait');mark.innerHTML=`<img src="${D.uiAssets.portrait}" alt="${esc(D.build?.ascendClassName||D.build?.className||'Character')}">`;}
}

function renderLibraryHome(){
 document.body.classList.add('libraryhome');document.body.dataset.design='board';
 document.title='Your builds · League Start Companion';
 document.querySelector('.brand strong').textContent='LEAGUE START';
 $('stage').setAttribute('role','main');$('stage').removeAttribute('aria-labelledby');
 $('stage').innerHTML=`<header class="libraryhero"><p class="eyebrow">League Start Companion</p><h1>Your builds</h1><p>Import a PoB to get your gem shopping list, passive tree changes, ascendancy and equipment in one place.</p><button data-open-library>Import PoB / manage builds →</button></header><div id="homeBuilds" aria-live="polite"><p>Loading your saved builds…</p></div><p class="libraryprivacy">Builds and character progress stay on this computer.</p>`;
 if(location.protocol==='file:'){$('homeBuilds').innerHTML='<section class="libraryempty"><h2>Start your local companion</h2><p>Double-click Start Slayer Companion.bat to open your saved builds and import PoBs.</p></section>';return;}
 refreshLibraryHome();
}
async function refreshLibraryHome(){
 if(!$('homeBuilds'))return;
 try{
  const response=await fetch('/api/builds',{cache:'no-store'});if(!response.ok)throw Error('Could not load your saved builds.');const data=await response.json();
  if(!$('homeBuilds'))return;
  $('homeBuilds').innerHTML=data.builds.length?`<div class="librarycards">${data.builds.map(b=>`<a class="librarycard" href="/guide?build=${encodeURIComponent(b.id)}"><span class="eyebrow">Saved guide</span><h2>${esc(b.name)}</h2><span>Open guide →</span></a>`).join('')}</div>`:'<section class="libraryempty"><h2>Ready for your first build</h2><p>Paste a PoB code or pobb.in link to create a guide. Your gem progress stays saved when you switch builds.</p><button data-open-library>Import your first PoB →</button></section>';
 }catch(error){if($('homeBuilds'))$('homeBuilds').textContent=error.message;}
}
document.addEventListener('click',e=>{if(e.target.closest('[data-open-library]'))openImporter();});

window.addEventListener('pywebviewready',()=>{
 const button=document.createElement('button');button.innerHTML=uiIcon('settings');button.id='appSettings';button.className='iconbutton';button.setAttribute('aria-label','App settings');button.title='App settings';document.querySelector('.topactions').append(button);
 button.addEventListener('click',async()=>{const settings=await window.pywebview.api.settings();record('App settings',`<div class="appsettings"><h3>Updates · Version ${esc(settings.version)}</h3><p>Updates download automatically in the background. You choose when to restart and install.</p><button id="checkAppUpdates">Check for updates</button><button id="restartAppUpdate" hidden>Restart to update</button><p id="appUpdateStatus" role="status"></p><p class="importnotes">Checks run at startup and every four hours. Downloads are verified before installation. Saved builds and progress are kept.</p><h3>Path of Exile game log</h3><p class="importnotes">${esc(settings.logPath)}</p><button id="chooseGameLog">Choose Client.txt…</button><h3>Local saves</h3><p class="importnotes">${esc(settings.dataDir)}</p><div class="settingsactions"><button id="importExistingSaves">Import saves from an existing companion folder…</button><button id="openAppData">Open save folder</button></div><p id="desktopStatus" role="status"></p><p>Imports copy saved builds and progress without replacing existing files. The original folder is left untouched.</p></div>`);});
});
document.addEventListener('click',async e=>{
 const button=e.target.closest('#chooseGameLog,#importExistingSaves,#openAppData,#checkAppUpdates,#restartAppUpdate,#updateReadyBanner');if(!button)return;
 button.disabled=true;
 try{
  if(button.id==='restartAppUpdate'||button.id==='updateReadyBanner')await window.pywebview.api.restart_to_update();
  if(button.id==='chooseGameLog'){const settings=await window.pywebview.api.choose_game_log();$('desktopStatus').textContent='Reading '+settings.logPath;}
  if(button.id==='importExistingSaves'){const result=await window.pywebview.api.import_existing_saves();$('desktopStatus').textContent=`Copied ${result.copied} save files. Reopen the build library to choose a guide.`;if(!D.sets.length)refreshLibraryHome();}
  if(button.id==='openAppData')await window.pywebview.api.open_data_folder();
  if(button.id==='checkAppUpdates'){const result=await window.pywebview.api.check_updates();if(result.message&&$('desktopStatus'))$('desktopStatus').textContent=result.message;}
 }catch(error){const message=error.message||String(error);if($('desktopStatus'))$('desktopStatus').textContent=message;else record('Update could not start',`<p>${esc(message)}</p>`);}
 finally{button.disabled=false;}
});

window.addEventListener('pywebviewready',()=>{
 async function refreshUpdateStatus(){
  try{
   const state=await window.pywebview.api.update_status();
   const status=$('appUpdateStatus');if(status)status.textContent=state.message;
   const restart=$('restartAppUpdate');if(restart)restart.hidden=state.status!=='ready';
   let banner=$('updateReadyBanner');
   if(state.status==='ready'){
    if(!banner){banner=document.createElement('button');banner.id='updateReadyBanner';document.querySelector('.topactions').prepend(banner);}
    banner.textContent='Update '+state.version+' ready · Restart';
   }else if(banner)banner.remove();
  }catch(error){ /* Native bridge may be closing during restart. */ }
 }
 refreshUpdateStatus();setInterval(refreshUpdateStatus,2000);
});
