<header class="topbar"><div class="brand"><div class="brandmark" aria-hidden="true"><span>L</span></div><div><strong>LEAGUE START</strong></div></div><div class="topactions"><details class="toolsmenu" id="toolsMenu"><summary class="iconbutton" aria-label="Tools menu" title="Tools"><svg class="uiicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></summary><div class="toolspop"><button id="finderOpen">Find a gem</button><button data-record="sources">Sources &amp; help</button></div></details></div></header>
<div class="shell"><nav class="sidebar" id="navigation" role="tablist" aria-label="PoB leveling milestones" aria-orientation="vertical"></nav><main id="stage" role="tabpanel" tabindex="-1"></main></div>
<dialog class="dialog zoomdialog" id="treeDialog" aria-labelledby="treeDialogTitle"><div class="dialoghead"><h2 id="treeDialogTitle">Passive tree</h2><div class="zoomcontrols"><button id="zoomOut" aria-label="Zoom out">−</button><span id="zoomLabel" class="small">100%</span><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomFit">Fit</button><button data-close="treeDialog">Close</button></div></div><div class="zoomstage" id="zoomStage"><img id="zoomImage" alt="Selected PoB milestone passive tree"></div></dialog>

<script id="guideData" type="application/json">__GUIDE_DATA__</script><script>
'use strict';
const D=JSON.parse(document.getElementById('guideData').textContent),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=0,itemFilter='Equipment',targetLevels=false,zoom=1;
let owned={};try{owned=JSON.parse(localStorage.getItem('slayer-owned-v1')||'{}')}catch{}
const uniqueNames=s=>[...new Set(s.groups.flatMap(g=>g.gems.filter(x=>!x.itemGranted).map(x=>x.nameSpec)))];
const comparison=i=>Math.max(0,i-1);
const newNames=i=>i===0?uniqueNames(D.sets[i]):uniqueNames(D.sets[i]).filter(n=>!uniqueNames(D.sets[comparison(i)]).includes(n));
function route(name){const a=D.acquisition[name];return {act:a[0],vendor:a[1],quest:a[2],kind:a[3],source:a[4]||'https://poedb.tw/us/Quest'};}
function routeText(name,link=true){const r=route(name),v=r.act?`Act ${r.act} · ${r.vendor} · after ${r.quest}`:`${r.vendor} · ${r.quest}`;return link?`<a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(v)}</a>`:esc(v);}
function makeNav(){let html='';for(const [label,start,end] of (D.imported?[['Imported milestones',0,D.sets.length]]:[['Campaign',0,5],['Atlas progression',5,8]])){html+=`<div class="navgroup"><p class="eyebrow">${esc(label)}</p>`;for(let i=start;i<Math.min(end,D.sets.length);i++){const s=D.sets[i];html+=`<button class="tab" id="tab-${i}" type="button" role="tab" aria-controls="stage" aria-selected="${i===current}" tabindex="${i===current?0:-1}" data-tab="${i}"><span class="num">${esc(s.short)}</span><span class="label"><strong>${esc(s.nav)}</strong>${esc(s.navSub)}</span></button>`;}html+='</div>';}html+=`<div class="sidefoot">${infoTip((D.imported?D.name:"Leveling guide")+". "+D.sets.length+" milestones. Bandit: "+(D.build?.bandit||"Not specified"),"About this guide")}</div>`;$('navigation').innerHTML=html;}
function gemRow(g,group,i){const r=route(g.nameSpec),isNew=newNames(i).includes(g.nameSpec),off=group.enabled==='false'||g.enabled==='false';return `<div class="gemrow"><span class="gemicon c${g.color}" aria-label="${['','red','green','blue','white'][g.color]||'neutral'} gem"></span><div><div class="gemtitle"><span>${esc(g.nameSpec)}</span>${isNew&&!g.itemGranted?'<span class="new">new</span>':''}${off?`<span class="state">${group.enabled==='false'?'group disabled':'gem disabled'}</span>`:''}</div><div class="acq">${routeText(g.nameSpec)}</div><div class="gemmeta">PoB gem level ${esc(g.level)} · ${esc(g.quality)}% quality${g.requiredLevel?` · requires character ${g.requiredLevel} at this gem level`:''}</div></div><span class="uselevel">${g.itemGranted?'Item effect':`Use from ${g.minLevel??"?"}`}</span></div>`;}
function skills(s,i){const rank=g=>g.main?0:g.enabled==="false"?4:g.slot==="Body Armour"&&g.gems.some(x=>!x.isSupport&&!x.itemGranted)?1:g.gems.some(x=>!x.isSupport&&!x.itemGranted)?2:3;return s.groups.filter(g=>g.gems.some(x=>!x.itemGranted)).sort((a,b)=>rank(a)-rank(b)).map(g=>{const gems=g.gems.filter(x=>!x.itemGranted);return `<article class="skillgroup ${g.enabled==='false'?'disabledgroup':''}"><header class="grouphead"><div><div class="slot">${esc(g.slot||'Utility')}${rank(g)===0?' · Main skill':''}</div><h3>${esc(g.label.replace(/^(Helm|Body|Boots|Gloves|Weapon)\s*-\s*/,''))}</h3></div><div class="sockets" aria-label="Gem colours">${gems.filter(x=>g.enabled!=='false'&&x.enabled!=='false').map((x,k)=>`${k?'<span class="socketlink"></span>':''}<i class="c${x.color}"></i>`).join('')}</div></header>${gems.map(x=>gemRow(x,g,i)).join('')}</article>`;}).join('');}
function passiveList(list){return list.map(n=>`<div class="passive"><strong>${esc(n.name)}</strong><ul>${n.stats.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');}
function changes(i){if(!i)return '<h3>Start here</h3><p>Assemble the Spectral Throw links as Act 1 quests unlock. Leap Slam requires character level 10.</p>';const prev=D.sets[comparison(i)],s=D.sets[i],added=newNames(i),removed=uniqueNames(prev).filter(n=>!uniqueNames(s).includes(n));return `<h3>${i>=8?'Compared with level 96':'Changes from '+esc(prev.short)}</h3>${added.length?`<p><strong>Add:</strong> ${added.map(esc).join(', ')}.</p>`:'<p>No new socketed gem names in this loadout.</p>'}${removed.length?`<p><strong>Removed from this preset:</strong> ${removed.map(esc).join(', ')}.</p>`:''}`;}
function shopping(s,i){const names=newNames(i);if(!names.length)return '';const sorted=names.slice().sort((a,b)=>{const x=route(a),y=route(b);return (x.act||9)-(y.act||9)||(D.meta[a].minLevel||0)-(D.meta[b].minLevel||0)||a.localeCompare(b);});return `<section class="shop"><div class="sectionhead"><div><p class="eyebrow">Acquisition checklist</p><h2>${i===0?'Get these in Act 1':i>=8?'Gems for this alternative':'New gems for this milestone'}</h2></div></div><p class="explain">${i===0?'All socketed gem names in this milestone.':i>=8?'Compared with the level-96 loadout.':'New gem names compared with the previous milestone.'} Tick gems you already own. Your checks stay in this browser.</p><div class="shopgrid">${sorted.map(n=>`<div class="shopitem"><input type="checkbox" id="owned-${D.names.indexOf(n)}" data-owned="${esc(n)}" ${owned[n]?'checked':''}><label for="owned-${D.names.indexOf(n)}"><strong>${esc(n)}${s.groups.flatMap(g=>g.gems).filter(g=>g.nameSpec===n&&g.enabled!=='false').length>1?' ×'+s.groups.flatMap(g=>g.gems).filter(g=>g.nameSpec===n&&g.enabled!=='false').length:''}</strong>${!s.groups.some(g=>g.enabled!=='false'&&g.gems.some(x=>x.nameSpec===n&&x.enabled!=='false'))?'<small>Optional · disabled in this PoB loadout</small>':''}<small>Use from character ${D.meta[n].minLevel} · ${routeText(n)}</small></label></div>`).join('')}</div></section>`;}
function itemCategory(it){return /Flask/.test(it.slot)?'Flasks':/Tree jewel|Abyssal/.test(it.slot)?'Jewels':'Equipment';}
function itemCards(s){const items=s.items.filter(it=>itemCategory(it)===itemFilter);if(!items.length)return `<div class="emptyitem">No ${itemFilter.toLowerCase()} specified in this PoB preset.</div>`;return items.map((it,k)=>`<article class="itemcard ${it.rarity.toLowerCase()}"><p class="itemslot">${esc(it.slot)}</p><h3 class="itemname">${esc(it.name)}</h3><p class="itembase">${esc(it.base)}${it.hands?' · '+esc(itemHandedness(it)):''}${it.requirement?` · Requires level ${it.requirement}`:''}</p><div class="itemsummary">${it.highlights.map(x=>`<p>${esc(x)}</p>`).join('')}</div><details><summary>Full PoB item details</summary><pre>${esc(it.clean)}</pre><button class="copyitem" data-copy="${s.items.indexOf(it)}">Copy PoB item</button></details></article>`).join('');}
function render(i,focus=false){current=i;itemFilter='Equipment';const s=D.sets[i],granted=s.groups.flatMap(g=>g.gems.filter(x=>x.itemGranted));makeNav();$('stage').setAttribute('aria-labelledby',`tab-${i}`);$('stage').classList.toggle('showtargets',targetLevels);$('stage').innerHTML=`
<header class="stagehero"><div><p class="eyebrow">${i<5?'Campaign':i<8?'Atlas progression':'Endgame alternative'} · ${i+1} / ${D.sets.length}</p><h1>${esc(s.heading)}</h1><p class="subtitle">${esc(s.description)}</p><div class="tagrow"><span class="badge important">${esc(s.title)}</span><span class="badge">${s.groups.filter(g=>g.gems.some(x=>!x.itemGranted)).length} socket groups</span><span class="badge">${s.items.length} specified ${s.items.length===1?'item':'items'}</span>${s.ascendancy.length?`<span class="badge">${s.ascendancy.length*2} Slayer points</span>`:''}</div></div><div class="stagecontrols"><button data-step="-1" ${i===0?'disabled':''} aria-label="Previous milestone">←</button><button data-step="1" ${i===D.sets.length-1?'disabled':''} aria-label="Next milestone">→</button></div></header>
${s.cautions.length?`<aside class="callout"><strong>${esc(s.cautionTitle)}</strong>${s.cautions.map(x=>`<p>${esc(x)}</p>`).join('')}</aside>`:''}
<div class="contentgrid"><section aria-labelledby="skillsTitle"><div class="sectionhead"><div><p class="eyebrow">01 · Socket groups</p><h2 id="skillsTitle">Skills & links</h2></div><label class="switchlabel"><input type="checkbox" id="targetToggle" ${targetLevels?'checked':''}>Show PoB gem levels</label></div>${skills(s,i)}${granted.length?`<details class="snapshotdetails"><summary>Item-granted effects (${granted.length})</summary>${granted.map(g=>`<div class="passive"><strong>${esc(g.nameSpec)}</strong><p>${routeText(g.nameSpec)}</p></div>`).join('')}</details>`:''}${s.skillImage?`<details class="snapshotdetails"><summary>Original PoB skills screenshot</summary><img src="${s.skillImage}" alt="Original skills screenshot for ${esc(s.title)}" loading="lazy"></details>`:''}</section>
<section class="treecolumn" aria-labelledby="treeTitle"><div class="sectionhead"><div><p class="eyebrow">02 · Allocations</p><h2 id="treeTitle">Passive tree</h2></div><small>Up to this milestone</small></div><div class="treecard"><img src="${s.treeImage}" class="treeimage" id="treeThumb" alt="Allocated passive tree for ${esc(s.title)}; click to enlarge" tabindex="0" role="button"><div class="treeactions"><small>Gold paths show allocated nodes. This is the complete PoB milestone tree.</small><button id="treeOpen">Enlarge tree ↗</button></div><div class="ascendancy"><p class="eyebrow">Slayer ascendancy</p>${s.ascendancy.length?`<div class="ascnodes">${s.ascendancy.map(x=>`<span>${esc(x.name)}</span>`).join('')}</div>`:'<p class="muted small">No ascendancy allocated yet.</p>'}</div><div class="treebelow"><details><summary>Allocated notables & keystones (${s.notables.length})</summary>${passiveList(s.notables)}</details>${s.masteryDetails.length?`<details><summary>Selected masteries (${s.masteryDetails.length})</summary>${passiveList(s.masteryDetails)}</details>`:''}<p class="muted small">PoB screenshot is authoritative for jewel radii, transformed nodes and cluster allocations.</p></div></div><div class="changes">${changes(i)}</div></section></div>
${shopping(s,i)}
<section class="itemsection" aria-labelledby="itemsTitle"><div class="sectionhead"><div><p class="eyebrow">03 · Equipment targets</p><h2 id="itemsTitle">Item overview</h2></div><small>Selected PoB variant</small></div>${i<5?'<p class="itemnotice">This PoB preset specifies only a weapon. Armour, jewellery and flasks are left open; no additional gear targets have been invented.</p>':''}<div class="itemtabs" aria-label="Item category">${['Equipment','Flasks','Jewels'].map(c=>`<button data-item-filter="${c}" aria-pressed="${c===itemFilter}">${c} <span class="muted">${s.items.filter(it=>itemCategory(it)===c).length}</span></button>`).join('')}</div><div class="itemgrid" id="itemGrid">${itemCards(s)}</div>${s.itemImage?`<details class="snapshotdetails"><summary>Original PoB equipped-item screenshot</summary><img src="${s.itemImage}" alt="Equipped items for ${esc(s.title)}" loading="lazy"></details>`:''}</section>
<div class="endnav"><button data-step="-1" ${i===0?'disabled':''}>← ${i>0?esc(D.sets[i-1].short+' '+D.sets[i-1].nav):'First milestone'}</button><button data-step="1" ${i===D.sets.length-1?'disabled':''}>${i<D.sets.length-1?esc(D.sets[i+1].short+' '+D.sets[i+1].nav):'Last milestone'} →</button></div>
<footer class="sourcefoot"><p>Build source: your saved Slayer PoB · tree 3.29 · Bandit: Alira · Standard campaign, not Ruthless.</p><details><summary>How to read this guide & sources</summary><ul><li>Each tab matches one named PoB loadout. Range tabs show the loadout at the end of that range, not a promise that every gem is usable at its start.</li><li>“Use from” is the level-1 gem's character requirement. Purchase unlocks depend on quests, not a fixed character level. Higher-level vendor gems can require a higher character level.</li><li>PoB gem levels and qualities are the saved targets. Disabled gems/groups remain labelled. A level-21 gem or exceptional level-4 gem is not a routine vendor purchase.</li><li>Normal vendor gems have an Act 6 fallback: Lilly Roth after <a href="https://www.poewiki.net/wiki/Fallen_from_Grace" target="_blank" rel="noopener">Fallen from Grace</a>. Transfigured and drop-only gems remain exceptions.</li><li>Vendor relationships: <a href="https://poedb.tw/us/Quest" target="_blank" rel="noopener">PoEDB quest vendor table</a>, checked 11 November 2026. Each acquisition line links to its source; level requirements come from the installed PoB game records.</li><li>Key class restriction: <a href="https://www.poewiki.net/wiki/Infused_Channelling_Support" target="_blank" rel="noopener">Infused Channelling</a> is obtained from <a href="https://www.poewiki.net/wiki/Siosa" target="_blank" rel="noopener">Siosa</a> by a Duelist; its level-4 requirement does not unlock Nessa's stock.</li><li>Item details resolve the selected PoB variant and saved numeric rolls. The copied PoB item retains its original import text. The item overview is a target list, not a claim that those items are available at a campaign vendor.</li><li>Native notable descriptions do not recalculate Timeless/cluster jewel transformations. Use the screenshot and the equipped jewel details together.</li></ul></details></footer>`;
 document.title=`${s.short} ${s.nav} · League Start Companion`;history.replaceState(null,'',`#${s.key}`);if(focus){window.scrollTo({top:0,behavior:'instant'});$('stage').focus({preventScroll:true});}const active=$(`tab-${i}`);if(innerWidth<760)active.scrollIntoView({block:'nearest',inline:'center'});
}
function openTree(){const s=passiveCheckpointSetup();$('zoomImage').src=passiveView==='changes'?(s.treeDiffImage||s.treeImage):s.treeImage;$('treeDialogTitle').textContent=s.title+' · Passive tree';$('treeDialog').showModal();$('zoomImage').onload=fitTree;fitTree();}
function applyZoom(){const im=$('zoomImage');im.style.width=Math.round(im.naturalWidth*zoom)+'px';$('zoomLabel').textContent=Math.round(zoom*100)+'%';}
function fitTree(){const im=$('zoomImage'),box=$('zoomStage');if(!im.naturalWidth)return;zoom=Math.min((box.clientWidth-24)/im.naturalWidth,(box.clientHeight-24)/im.naturalHeight);applyZoom();box.scrollTo(0,0);}
function finder(){const q=$('finderSearch').value.trim().toLowerCase();const names=D.names.filter(n=>n.toLowerCase().includes(q));$('finderResults').innerHTML=names.map(n=>{const meta=D.meta[n],first=D.sets.findIndex(s=>s.groups.some(g=>g.gems.some(x=>x.nameSpec===n)));return `<div class="finderrow"><div><strong>${esc(n)}</strong><small>${meta.itemGranted?'Item effect':`Use from character ${meta.minLevel??"?"}`} · ${routeText(n)}</small><small>First included in this PoB: ${esc(D.sets[first].title)}</small></div><button data-jump="${first}">Open milestone ↗</button></div>`;}).join('')||'<p class="muted">No matching gem.</p>';}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(b){if(b.dataset.tab!==undefined)render(Number(b.dataset.tab),true);if(b.dataset.step)render(current+Number(b.dataset.step),true);if(b.dataset.close)$(b.dataset.close).close();if(b.dataset.jump!==undefined){$('finderDialog').close();render(Number(b.dataset.jump),true);}if(b.dataset.itemFilter){itemFilter=b.dataset.itemFilter;document.querySelectorAll('[data-item-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('itemGrid').innerHTML=itemCards(D.sets[current]);}if(b.dataset.copy!==undefined){const text=D.sets[current].items[Number(b.dataset.copy)].item;try{await navigator.clipboard.writeText(text);b.textContent='Copied';}catch{const ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();b.textContent='Copied';}}}if(e.target.id==='treeOpen'||e.target.id==='treeThumb')openTree();});
document.addEventListener('change',e=>{if(e.target.id==='targetToggle'){targetLevels=e.target.checked;$('stage').classList.toggle('showtargets',targetLevels);}if(e.target.dataset.owned){owned[e.target.dataset.owned]=e.target.checked;try{localStorage.setItem('slayer-owned-v1',JSON.stringify(owned))}catch{}}});
$('navigation').addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?D.sets.length-1:Math.max(0,Math.min(D.sets.length-1,current+(['ArrowDown','ArrowRight'].includes(e.key)?1:-1)));render(next);$(`tab-${next}`).focus();}});
document.addEventListener('keydown',e=>{if(e.target.id==='treeThumb'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTree();}});
$('finderOpen').onclick=()=>{$('finderDialog').showModal();finder();$('finderSearch').focus();};$('finderSearch').oninput=finder;$('zoomIn').onclick=()=>{zoom=Math.min(6,zoom*1.3);applyZoom();};$('zoomOut').onclick=()=>{zoom=Math.max(.2,zoom/1.3);applyZoom();};$('zoomFit').onclick=fitTree;
for(const id of ['treeDialog','finderDialog','recordDialog'])$(id).addEventListener('click',e=>{if(e.target===$(id)){const r=$(id).getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$(id).close();}});
const initial=D.sets.findIndex(s=>s.key===location.hash.slice(1));render(initial>=0?initial:0);
</script></body></html>
